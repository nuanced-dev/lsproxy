name: Release Language Images

on:
  push:
    tags:
      - 'language-images-v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/nuanced-dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Validate tag version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/language-images-v}"
          DEFAULT_VERSION=$(cat language-image-version)

          echo "Tag version: $TAG_VERSION"
          echo "Default language version: $DEFAULT_VERSION"

          if [ "$TAG_VERSION" != "$DEFAULT_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match default language version ($DEFAULT_VERSION)"
            exit 1
          fi

          echo "✓ Tag version matches default language version"
          echo "LANGUAGE_TAG=$DEFAULT_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform language images
        run: |
          ./scripts/build-images.sh \
            --all-languages \
            --multi-platform \
            --cache=gha \
            --sequential

      - name: Publish language images
        run: |
          ./scripts/publish-images.sh \
            --all-languages \
            --registry=${{ env.REGISTRY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: language-images-v${{ steps.version.outputs.LANGUAGE_TAG }}
          name: Language Images v${{ steps.version.outputs.LANGUAGE_TAG }}
          body: |
            ## Language Images Release v${{ steps.version.outputs.LANGUAGE_TAG }}

            Multi-platform Docker images for all supported language servers.

            ### Images Published
            - `${{ env.REGISTRY }}/nuanced-lsp-clangd:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-csharp:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-golang:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-java:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-php:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-python:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-ruby-*:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-ruby-sorbet-*:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-rust:${{ steps.version.outputs.LANGUAGE_TAG }}`
            - `${{ env.REGISTRY }}/nuanced-lsp-typescript:${{ steps.version.outputs.LANGUAGE_TAG }}`

            ### Platforms
            - linux/amd64
            - linux/arm64
          draft: false
          prerelease: false
