name: Release Language Images

on:
  push:
    tags:
      - 'language-images-v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/nuanced-dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Validate tag version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/language-images-v}"
          CURRENT_VERSION=$(cat language-image-version)

          echo "Tag version: $TAG_VERSION"
          echo "Current language version: $CURRENT_VERSION"

          if [ "$TAG_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match current language version ($CURRENT_VERSION)"
            exit 1
          fi

          echo "✓ Tag version matches current language version"
          echo "LANGUAGE_TAG=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform language images
        run: |
          ./scripts/build-images.sh \
            --all-languages \
            --multi-platform \
            --cache=gha \
            --sequential

      - name: Publish language images
        run: |
          ./scripts/publish-images.sh \
            --all-languages \
            --registry=${{ env.REGISTRY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: language-images-v${{ steps.version.outputs.LANGUAGE_TAG }}
          name: Language Images v${{ steps.version.outputs.LANGUAGE_TAG }}
          body: |
            ## Language Images Release v${{ steps.version.outputs.LANGUAGE_TAG }}

            Published multi-platform Docker images for all supported language servers to ${{ env.REGISTRY }}.

            ### Changes

            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          draft: false
          prerelease: false
