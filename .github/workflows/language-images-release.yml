name: Release Language Images

on:
  push:
    tags:
      - 'language-images-*-v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/nuanced-dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Parse tag
        id: tag
        run: |
          # Format: language-images-LANGUAGE-vX.Y.Z
          TAG_NAME="${GITHUB_REF#refs/tags/language-images-}"
          LANGUAGE="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"

          echo "Language: $LANGUAGE"
          echo "Tag: $TAG"

          echo "LANGUAGE=$LANGUAGE" >> $GITHUB_OUTPUT
          echo "LANGUAGE_TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform language images
        run: |
          ./scripts/build-images.sh \
            --languages=${{ steps.tag.outputs.LANGUAGE }} \
            --language-tag=${{ steps.tag.outputs.LANGUAGE_TAG }} \
            --multi-platform \
            --cache=gha \
            --sequential

      - name: Publish images
        run: |
          ./scripts/publish-images.sh \
            --languages=${{ steps.tag.outputs.LANGUAGE }} \
            --language-tag=${{ steps.tag.outputs.LANGUAGE_TAG }} \
            --registry=${{ env.REGISTRY }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.LANGUAGE }} v${{ steps.tag.outputs.LANGUAGE_TAG }}
          body: |
            ## ${{ steps.tag.outputs.LANGUAGE }} v${{ steps.tag.outputs.LANGUAGE_TAG }} release

            Published multi-platform Docker language images for ${{ steps.tag.outputs.LANGUAGE }} v${{ steps.tag.outputs.LANGUAGE_TAG }}.
          draft: false
          prerelease: false
