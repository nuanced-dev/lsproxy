name: Release Language Images

on:
  push:
    tags:
      - 'language-images-*-v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/nuanced-dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest-large
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Parse tag
        id: tag
        run: |
          # Format: language-images-LANGUAGE-vX.Y.Z
          TAG_NAME="${GITHUB_REF#refs/tags/language-images-}"
          LANGUAGE="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"

          echo "Language: $LANGUAGE"
          echo "Version: $VERSION"

          echo "LANGUAGE=$LANGUAGE" >> $GITHUB_OUTPUT
          echo "LANGUAGE_TAG=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish language images
        run: |
          ./scripts/build-images.sh \
            --languages=${{ steps.tag.outputs.LANGUAGE }} \
            --language-tag=${{ steps.tag.outputs.LANGUAGE_TAG }} \
            --publish \
            --cache=gha \
            --sequential

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Language ${{ steps.tag.outputs.LANGUAGE }} v${{ steps.tag.outputs.LANGUAGE_TAG }}
          body: |
            Published multi-platform container images for language ${{ steps.tag.outputs.LANGUAGE }} v${{ steps.tag.outputs.LANGUAGE_TAG }} to ${{ env.REGISTRY }}.

            ### Changes

            See [changelog](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.languages.md) for details.
          draft: false
          prerelease: false
