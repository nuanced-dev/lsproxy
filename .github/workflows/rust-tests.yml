name: Rust Tests

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
    RUST_TAG: actions-run-${{ github.run_id }}
    LANGUAGE_TAG: "1.0.0"

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Build without Docker cache to ensure fresh Docker layers, but use GitHub Actions
      # cache backend for BuildKit cache mounts (Cargo registry and build artifacts).
      # This gives us reproducible builds while still caching Rust compilation.
      - name: Build Rust images
        run: ./scripts/build-rust-images.sh --tag=${{ env.RUST_TAG }} --language-tag=${{ env.LANGUAGE_TAG }} --cache=gha --sequential

      - name: Export images
        run: |
          mkdir -p build-artifacts
          docker save \
            nuanced-lsp-proxy:${{ env.RUST_TAG }} \
            nuanced-lsp-wrapper:${{ env.RUST_TAG }} \
            nuanced-lsp-watchdog:${{ env.RUST_TAG }} \
            -o build-artifacts/images.tar

      - uses: actions/upload-artifact@v6
        with:
          name: built-images
          path: build-artifacts/images.tar

  test-container-lifecycle:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      LANGUAGE_TAG: "1.0.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }}

      - name: Run container lifecycle tests
        run: ./scripts/test-container-lifecycle.sh --tag=${{ env.RUST_TAG }} --language-tag=${{ env.LANGUAGE_TAG }}

  test-watchdog:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      LANGUAGE_TAG: "1.0.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }}

      - name: Run watchdog tests
        run: ./scripts/test-watchdog.sh --tag=${{ env.RUST_TAG }} --language-tag=${{ env.LANGUAGE_TAG }}

  test-all-endpoints:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      LANGUAGE_TAG: "1.0.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Pre-pull all language images from GHCR
        run: |
          # Pull all language images in parallel for faster startup
          echo "Pulling language images from GHCR..."
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-typescript:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-rust:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-golang:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-java:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-clangd:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-csharp:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-php:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.4.4:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.4.4:${{ env.LANGUAGE_TAG }} &
          wait
          echo "All language images pulled successfully"

      - name: Run all-endpoints tests
        run: ./scripts/test-all-endpoints.sh --tag=${{ env.RUST_TAG }} --language-tag=${{ env.LANGUAGE_TAG }}

  test-rust:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/download-artifact@v6
        with:
          name: built-images
          path: build-artifacts

      - name: Load Rust images
        run: docker load -i build-artifacts/images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }}

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets --all-features
        env:
            RUST_IMAGE_VERSION: ${{ env.RUST_TAG }}
            LANGUAGE_IMAGE_VERSION: ${{ env.LANGUAGE_TAG }}
