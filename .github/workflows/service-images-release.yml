name: Release Service Images

on:
  push:
    tags:
      - 'service-images-v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/nuanced-dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest-large
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Validate tag version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/service-images-v}"
          CURRENT_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "proxy") | .version')

          echo "Tag version: $TAG_VERSION"
          echo "Current service version: $CURRENT_VERSION"

          if [ "$TAG_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match current service version ($CURRENT_VERSION)"
            exit 1
          fi

          echo "✓ Tag version matches current service version"
          echo "SERVICE_TAG=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish service images
        run: |
          ./scripts/build-images.sh \
            --all-services \
            --publish \
            --cache=gha \
            --sequential

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Services v${{ steps.version.outputs.SERVICE_TAG }}
          body: |
            Published multi-platform container images for service v${{ steps.version.outputs.SERVICE_TAG }} to ${{ env.REGISTRY }}.

            ### Changes

            See [changelog](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.services.md) for details.
          draft: false
          prerelease: false
