name: Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build proxy image
        run: docker build --no-cache -t nuanced-lsp-proxy:latest -f Dockerfile .

      - name: Build wrapper image
        run: docker build --no-cache -t nuanced-lsp-wrapper:latest -f dockerfiles/wrapper.Dockerfile .

      - name: Build watchdog image
        run: docker build --no-cache -t nuanced-lsp-watchdog:latest -f dockerfiles/watchdog.Dockerfile .

      - name: Export images
        run: |
          mkdir -p build-artifacts
          docker save \
            nuanced-lsp-proxy:latest \
            nuanced-lsp-wrapper:latest \
            nuanced-lsp-watchdog:latest \
            -o build-artifacts/images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: built-images
          path: build-artifacts/images.tar

  test-container-lifecycle:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Run container lifecycle tests
        run: ./scripts/test-container-lifecycle.sh

  test-watchdog:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Run watchdog tests
        run: ./scripts/test-watchdog.sh

  test-all-endpoints:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Run all-endpoints tests
        run: ./scripts/test-all-endpoints.sh

  test-rust:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets --all-features
