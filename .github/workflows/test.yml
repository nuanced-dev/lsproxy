name: Test Service and Client

on:
  pull_request:
    paths-ignore:
    - '*.md'
    - 'docs/**'
  push:
    branches:
    - main
    paths-ignore:
    - '*.md'
    - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
    LANGUAGE_TAG: "1"
    SERVICE_TAG: actions-run-${{ github.run_id }}

jobs:
  service-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --locked --workspace --all-targets --all-features
        env:
          SERVICE_IMAGE_VERSION: ${{ env.SERVICE_TAG }}
          LANGUAGE_IMAGE_VERSION: ${{ env.LANGUAGE_TAG }}

      - name: Check formatting
        run: cargo fmt --check

  build-service-images:
    runs-on: ubuntu-latest
    needs: service-check
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Build without Docker cache to ensure fresh Docker layers, but use GitHub Actions
      # cache backend for BuildKit cache mounts (Cargo registry and build artifacts).
      # This gives us reproducible builds while still caching Rust compilation.
      - name: Build service images
        run: |
          ./scripts/build-images.sh \
            --all-services --service-tag=${{ env.SERVICE_TAG }} \
            --language-tag=${{ env.LANGUAGE_TAG }} \
            --cache=gha \
            --sequential

      - name: Export images
        run: |
          mkdir -p build-artifacts
          docker save \
            nuanced-lsp-proxy:${{ env.SERVICE_TAG }} \
            nuanced-lsp-wrapper:${{ env.SERVICE_TAG }} \
            nuanced-lsp-watchdog:${{ env.SERVICE_TAG }} \
            -o service-images.tar

      - name: Upload service images
        uses: actions/upload-artifact@v6
        with:
          name: service-images
          path: service-images.tar
          retention-days: 1

  service-test-rust:
    runs-on: ubuntu-latest
    needs: build-service-images
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Download service images
        id:  download-service-images
        uses: actions/download-artifact@v6
        with:
          name: service-images

      - name: Load service images
        run: docker load -i ${{ steps.download-service-images.outputs.download-path }}/service-images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }}

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets --all-features
        env:
          SERVICE_IMAGE_VERSION: ${{ env.SERVICE_TAG }}
          LANGUAGE_IMAGE_VERSION: ${{ env.LANGUAGE_TAG }}

  service-test-container-lifecycle:
    runs-on: ubuntu-latest
    needs: build-service-images
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download service images
        id:  download-service-images
        uses: actions/download-artifact@v6
        with:
          name: service-images

      - name: Load service images
        run: docker load -i ${{ steps.download-service-images.outputs.download-path }}/service-images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }}

      - name: Run container lifecycle tests
        run: ./scripts/test-container-lifecycle.sh --service-tag=${{ env.SERVICE_TAG }} --language-tag=${{ env.LANGUAGE_TAG }}

  service-test-watchdog:
    runs-on: ubuntu-latest
    needs: build-service-images
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download service images
        id:  download-service-images
        uses: actions/download-artifact@v6
        with:
          name: service-images

      - name: Load service images
        run: docker load -i ${{ steps.download-service-images.outputs.download-path }}/service-images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }}

      - name: Run watchdog tests
        run: ./scripts/test-watchdog.sh --service-tag=${{ env.SERVICE_TAG }} --language-tag=${{ env.LANGUAGE_TAG }}

  service-test-all-endpoints:
    runs-on: ubuntu-latest
    needs: build-service-images
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Install websocat
        run: cargo install websocat

      - name: Download service images
        id:  download-service-images
        uses: actions/download-artifact@v6
        with:
          name: service-images

      - name: Load service images
        run: docker load -i ${{ steps.download-service-images.outputs.download-path }}/service-images.tar

      - name: Pre-pull all language images from GHCR
        run: |
          echo "Pulling language images from GHCR..."
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-clangd:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-csharp:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-golang:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-java:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-php:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.4.4:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.4.4:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-rust:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-typescript:${{ env.LANGUAGE_TAG }} &
          wait
          echo "All language images pulled successfully"

      - name: Run all-endpoints tests
        run: ./scripts/test-all-endpoints.sh --service-tag=${{ env.SERVICE_TAG }} --language-tag=${{ env.LANGUAGE_TAG }}

  typescript-client-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    defaults:
        run:
            working-directory: clients/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  typescript-client-test:
    runs-on: ubuntu-latest
    needs:
      - typescript-client-check
      - build-service-images
    defaults:
        run:
            working-directory: clients/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Download service images
        id:  download-service-images
        uses: actions/download-artifact@v6
        with:
          name: service-images

      - name: Load service images
        run: docker load -i ${{ steps.download-service-images.outputs.download-path }}/service-images.tar

      - name: Pre-pull all language images from GHCR
        run: |
          echo "Pulling language images from GHCR..."
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-clangd:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-csharp:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-golang:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-java:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-php:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.2.2:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.2.6:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.3.5:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.3.6:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.4.1:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.4.2:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.4.4:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.2.2:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.2.6:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.3.5:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.3.6:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.4.1:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.4.2:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.4.4:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-rust:${{ env.LANGUAGE_TAG }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-typescript:${{ env.LANGUAGE_TAG }} &
          wait
          echo "All language images pulled successfully"

      - name: Test
        run: npm run test
        env:
          NUANCED_LSP_TIMEOUT: 240
          FAIL_FAST: 1

  vscode-client-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    defaults:
        run:
            working-directory: clients/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
