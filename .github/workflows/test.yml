name: Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build with --no-cache to ensure fresh Docker layers, but use GitHub Actions
      # cache backend for BuildKit cache mounts (Cargo registry and build artifacts).
      # This gives us reproducible builds while still caching Rust compilation.
      - name: Build proxy image
        run: |
          docker buildx build \
            --no-cache \
            --cache-from type=gha,scope=proxy \
            --cache-to type=gha,mode=max,scope=proxy \
            --load \
            -t nuanced-lsp-proxy:latest \
            -f dockerfiles/proxy.Dockerfile .

      - name: Build wrapper image
        run: |
          docker buildx build \
            --no-cache \
            --cache-from type=gha,scope=wrapper \
            --cache-to type=gha,mode=max,scope=wrapper \
            --load \
            -t nuanced-lsp-wrapper:latest \
            -f dockerfiles/wrapper.Dockerfile .

      - name: Build watchdog image
        run: docker build --no-cache -t nuanced-lsp-watchdog:latest -f dockerfiles/watchdog.Dockerfile .

      - name: Export images
        run: |
          mkdir -p build-artifacts
          docker save \
            nuanced-lsp-proxy:latest \
            nuanced-lsp-wrapper:latest \
            nuanced-lsp-watchdog:latest \
            -o build-artifacts/images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: built-images
          path: build-artifacts/images.tar

  test-container-lifecycle:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      LANGUAGE_CONTAINER_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_CONTAINER_VERSION }}

      - name: Run container lifecycle tests
        run: ./scripts/test-container-lifecycle.sh

  test-watchdog:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      LANGUAGE_CONTAINER_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Pre-pull Python language image from GHCR
        run: docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_CONTAINER_VERSION }}

      - name: Run watchdog tests
        run: ./scripts/test-watchdog.sh

  test-all-endpoints:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      LANGUAGE_CONTAINER_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-images
          path: build-artifacts

      - name: Load images
        run: docker load -i build-artifacts/images.tar

      - name: Pre-pull all language images from GHCR
        run: |
          # Pull all language images in parallel for faster startup
          echo "Pulling language images from GHCR..."
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-python:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-typescript:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-rust:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-golang:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-java:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-clangd:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-csharp:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-php:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-3.4.4:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          docker pull ghcr.io/nuanced-dev/nuanced-lsp-ruby-sorbet-3.4.4:${{ env.LANGUAGE_CONTAINER_VERSION }} &
          wait
          echo "All language images pulled successfully"

      - name: Run all-endpoints tests
        run: ./scripts/test-all-endpoints.sh

  test-rust:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets --all-features
