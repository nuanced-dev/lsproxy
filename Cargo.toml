[workspace]
members = [
    "crates/common",
    "crates/proxy",
    "crates/wrapper",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Nuanced"]

[workspace.dependencies]
# Shared dependencies
actix-web = "4.0"
actix-ws = "0.3"
ast-grep = { version = "0.39", default-features = false }
tokio = { version = "1.0", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.3", features = ["derive"] }
thiserror = "1.0"
lsp-types = "0.95" # Upgrade needs resolution or workaround for https://github.com/gluon-lang/lsp-types/issues/284
async-trait = "0.1"
glob = "0.3"
ignore = "0.4.23"  # Pin to avoid edition2024 requirement in 0.4.25+
url = "2.5"
utoipa = "5.4"
strum = "0.26"
strum_macros = "0.26"
tempfile = "3.8"

# Common crate (internal)
common = { path = "crates/common" }

[profile.release]
incremental = true

[profile.dev]
incremental = true
